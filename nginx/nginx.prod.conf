# ============================================================
#  SettleUp — Nginx Load Balancer (Production)
# ============================================================
#
# Topology:
#
#   Internet
#     │
#     ▼
#  Nginx :443 (SSL termination)
#     │
#     ├── /api/*  ──► upstream backend_pool (N instances)
#     │                 ├─ backend_1:4000
#     │                 ├─ backend_2:4000
#     │                 └─ backend_N:4000
#     │
#     └── /*  ──────► /usr/share/nginx/html (built React SPA)
#
# ============================================================

worker_processes  auto;
worker_rlimit_nofile 65535;

events {
    worker_connections  8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"upstream":"$upstream_addr",'
            '"upstream_rt":"$upstream_response_time",'
            '"request_id":"$http_x_request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75;
    keepalive_requests  1000;
    server_tokens       off;
    types_hash_max_size 2048;

    # ── Gzip ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml font/woff2;

    # ── Proxy cache ───────────────────────────────────────
    # Cache GET /api/groups (read-heavy, low-volatility)
    proxy_cache_path /var/cache/nginx/api
        levels=1:2
        keys_zone=api_cache:10m
        max_size=100m
        inactive=60s
        use_temp_path=off;

    # ── Rate-limiting zones ───────────────────────────────
    limit_req_zone  $binary_remote_addr zone=req_global:20m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=req_auth:10m   rate=3r/s;
    limit_req_zone  $binary_remote_addr zone=req_api:20m    rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ── Backend upstream pool ─────────────────────────────
    upstream backend_pool {
        least_conn;

        # Docker Compose scales backend to N replicas;
        # add/remove lines here or use DNS-based SD with
        # resolver 127.0.0.11 and `server backend:4000 resolve;`
        server backend_1:4000 weight=5 max_fails=3 fail_timeout=30s;
        server backend_2:4000 weight=5 max_fails=3 fail_timeout=30s;
        server backend_3:4000 weight=5 max_fails=3 fail_timeout=30s;

        # Passive health check — mark backend down after
        # max_fails failures within fail_timeout window
        keepalive 64;
        keepalive_requests 100;
        keepalive_timeout  60s;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ─────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ${SERVER_NAME};          # Set via env or envsubst

        # ── TLS ───────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Modern TLS only (TLS 1.2+)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # HSTS — 1 year, include subdomains, preload list eligible
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ── Security headers ──────────────────────────────
        add_header X-Frame-Options           "SAMEORIGIN"              always;
        add_header X-Content-Type-Options    "nosniff"                 always;
        add_header X-XSS-Protection          "1; mode=block"           always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header X-Request-ID              $request_id               always;

        # ── Body limit ────────────────────────────────────
        client_max_body_size 2m;

        # ── Connection limits per IP ──────────────────────
        limit_conn conn_per_ip 30;

        # ── Health / readiness (no rate limit, no cache) ──
        location = /api/health {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;
        }

        location = /api/ready {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;
        }

        # ── Nginx status (internal only) ──────────────────
        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny  all;
            access_log off;
        }

        # ── Auth endpoints — strict rate limiting ─────────
        location ~ ^/api/auth/(login|register) {
            limit_req        zone=req_auth burst=8 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── Read-only group/balance endpoints — cached ────
        location ~ ^/api/groups/[^/]+/(balances|settlement-plan)$ {
            limit_req        zone=req_api burst=20 nodelay;
            limit_req_status 429;

            # Cache for 30 seconds — balances don't change that fast
            proxy_cache       api_cache;
            proxy_cache_key   "$host$uri$is_args$args$http_authorization";
            proxy_cache_valid 200 30s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_lock  on;
            add_header        X-Cache-Status $upstream_cache_status always;

            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;
        }

        # ── All other API routes ──────────────────────────
        location /api/ {
            limit_req        zone=req_global burst=50 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;

            # Retry on backend failure (safe for GET; skip for write methods)
            proxy_next_upstream       error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_connect_timeout  5s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            # Buffer tuning
            proxy_buffering           on;
            proxy_buffer_size         4k;
            proxy_buffers             8 4k;
        }

        # ── Static frontend assets (long-lived cache) ─────
        location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|svg|gif|webp)$ {
            root    /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── SPA fallback ──────────────────────────────────
        location / {
            root      /usr/share/nginx/html;
            index     index.html;
            try_files $uri $uri/ /index.html;

            # Do not cache index.html — always fresh
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ── 429 / 50x error pages ─────────────────────────
        error_page 429 /errors/429.json;
        error_page 502 503 504 /errors/50x.json;
        location /errors/ { internal; root /etc/nginx; }
    }
}
