# ============================================================
#  Splittr — Nginx Load Balancer (Development)
# ============================================================
#
# Topology:
#
#   Client
#     │
#     ▼
#  Nginx :80  ──── /api/*  ──► upstream backend_pool
#     │                          ├─ backend_1:4000
#     │                          ├─ backend_2:4000
#     │                          └─ backend_3:4000
#     │
#     └────  /*     ──────────► frontend:5173
#
# ============================================================

# ── Worker settings ──────────────────────────────────────
worker_processes auto;                     # 1 worker per CPU core
worker_rlimit_nofile 65535;                # Max open file descriptors

events {
    worker_connections  4096;              # Max simultaneous connections per worker
    use epoll;                             # Linux epoll is the most efficient
    multi_accept on;                       # Accept multiple connections per event
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr rt=$request_time '
                    'uct=$upstream_connect_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    server_tokens       off;               # Hide Nginx version

    # ── Gzip compression ─────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   1000;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml;

    # ── Connection limits (Nginx-level rate limiting) ─────
    # Limit by binary IP → 10 MB zone (~160 000 IPs)
    limit_req_zone  $binary_remote_addr zone=req_global:10m rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=req_auth:10m   rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstream: backend instances ───────────────────────
    # least_conn sends new requests to the backend with the
    # fewest active connections — best for unequal workloads.
    upstream backend_pool {
        least_conn;

        server backend_1:4000 weight=1 max_fails=3 fail_timeout=30s;
        server backend_2:4000 weight=1 max_fails=3 fail_timeout=30s;
        server backend_3:4000 weight=1 max_fails=3 fail_timeout=30s;

        # Keep persistent connections to backends
        keepalive 32;
    }

    # ── Upstream: frontend dev server ────────────────────
    upstream frontend_pool {
        server frontend:5173;
        keepalive 8;
    }

    # ── Server block ──────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Max request body size (1 MB)
        client_max_body_size 1m;

        # ── Nginx-level connection limits ─────────────────
        limit_conn conn_limit 20;           # Max 20 simultaneous connections per IP

        # ── Security headers ──────────────────────────────
        add_header X-Frame-Options          "SAMEORIGIN"              always;
        add_header X-Content-Type-Options   "nosniff"                 always;
        add_header X-XSS-Protection         "1; mode=block"           always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header X-Request-ID             $request_id               always;

        # ── Health check (no auth, no rate limit) ─────────
        location = /api/health {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;
        }

        location = /api/ready {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;
        }

        # ── Auth routes: strict Nginx rate limit ──────────
        location ~ ^/api/auth/(login|register) {
            # Handle CORS preflight OPTIONS request
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
                add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,DELETE,OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type,Authorization' always;
                add_header 'Access-Control-Max-Age' '86400' always;
                add_header 'Content-Length' '0' always;
                return 204;
            }

            limit_req           zone=req_auth burst=5 nodelay;
            limit_req_status    429;

            proxy_pass          http://backend_pool;
            proxy_http_version  1.1;
            proxy_set_header    Connection          "";
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    X-Request-ID        $request_id;
            proxy_set_header    Origin              $http_origin;

            # Add CORS headers to all responses
            add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,DELETE,OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type,Authorization' always;

            proxy_connect_timeout  5s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;
        }

        # ── All other API routes: standard rate limit ─────
        location /api/ {
            # Handle CORS preflight OPTIONS request
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
                add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,DELETE,OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type,Authorization' always;
                add_header 'Access-Control-Max-Age' '86400' always;
                add_header 'Content-Length' '0' always;
                return 204;
            }

            limit_req           zone=req_global burst=30 nodelay;
            limit_req_status    429;

            proxy_pass          http://backend_pool;
            proxy_http_version  1.1;
            proxy_set_header    Connection          "";
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    X-Request-ID        $request_id;
            proxy_set_header    Origin              $http_origin;

            # Add CORS headers to all responses
            add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,DELETE,OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type,Authorization' always;

            # Retry on upstream failure (NOT for POST/PUT/DELETE)
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_connect_timeout  5s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;
        }

        # ── Frontend proxy ───────────────────────────────
        location / {
            proxy_pass          http://frontend_pool;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade     $http_upgrade;
            proxy_set_header    Connection  "upgrade";  # WebSocket for HMR
            proxy_set_header    Host        $host;
            proxy_read_timeout  86400s;
        }

        # ── Custom error pages ────────────────────────────
        error_page 429 /errors/429.json;
        error_page 502 503 504 /errors/50x.json;

        location /errors/ {
            internal;
            root /etc/nginx;
        }
    }
}
