name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  lint-backend:
    name: 🔍 Lint Backend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint

  lint-frontend:
    name: 🔍 Lint Frontend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint

  test-backend-unit:
    name: 🧪 Backend Unit Tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run test:unit -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-unit-coverage, path: backend/coverage/ }

  test-backend-integration:
    name: 🧪 Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: testpw, POSTGRES_DB: settleup_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: postgresql://postgres:testpw@localhost:5432/settleup_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-key-min-32-chars-long
      JWT_REFRESH_SECRET: ci-refresh-secret-key-min-32-chars
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:integration -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-integration-coverage, path: backend/coverage/ }

  test-frontend:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: frontend-coverage, path: frontend/coverage/ }

  build-docker:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend  --target production -t settleup-backend:ci
      - run: docker build ./frontend --target production -t settleup-frontend:ci
      - run: docker build ./nginx    --target production -t settleup-nginx:ci

  summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend-unit, test-backend-integration, test-frontend, build-docker]
    if: always()
    steps:
      - name: Check all
        run: |
          FAILED=""
          [ "${{ needs.lint-backend.result }}"            != "success" ] && FAILED="$FAILED lint-backend"
          [ "${{ needs.lint-frontend.result }}"           != "success" ] && FAILED="$FAILED lint-frontend"
          [ "${{ needs.test-backend-unit.result }}"       != "success" ] && FAILED="$FAILED backend-unit"
          [ "${{ needs.test-backend-integration.result }}"!= "success" ] && FAILED="$FAILED backend-integration"
          [ "${{ needs.test-frontend.result }}"           != "success" ] && FAILED="$FAILED frontend"
          [ "${{ needs.build-docker.result }}"            != "success" ] && FAILED="$FAILED docker"
          if [ -n "$FAILED" ]; then echo "❌ Failed jobs:$FAILED"; exit 1; fi
          echo "✅ All CI checks passed!"
